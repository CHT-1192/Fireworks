<!doctype html>
<meta charset="utf-8">
<title>typing probe</title>
<!--
  tools/typing_probe.html —— "一个字母一个字母敲密语"的真浏览器测试夹具
  ---------------------------------------------------------------------------
  由 tools/browser_check.js 驱动（它用无头浏览器打开本页并读 #probe）：
  这里在 iframe 里加载开发服务器上的应用，然后**逐字符**往种子框里灌字符，每次
  只加一个并派发 input 事件 —— ui.js 的守卫监听的正是这个事件，所以不需要 CDP
  就能验证"敲对了留下来、敲错了被弹回去"的反馈是否真的成立。

  结果以 JSON 写进 #probe，并以 probe-ok / probe-fail 开头供轮询等待。
-->
<body style="margin:0;background:#000;color:#0f0;font:12px ui-monospace,monospace">
<iframe id="app" src="/?w=640&h=480&frames=30" style="width:640px;height:480px;border:0"></iframe>
<pre id="probe">pending</pre>
<script>
(function () {
  var problems = [];
  var steps = [];
  var frame = document.getElementById('app');
  var probe = document.getElementById('probe');

  function done() {
    probe.textContent = (problems.length ? 'probe-fail ' : 'probe-ok ')
      + JSON.stringify({ problems: problems, steps: steps });
  }

  /** 逐字符模拟输入：只加一个字符，然后派发 input（守卫就监听它）。 */
  function typeChar(input, ch) {
    input.value += ch;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    return input.value;
  }

  function setValue(input, v) {
    input.value = v;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function run(win) {
    var FW = win.FW, app = FW.app.instance, input = win.document.getElementById('seed');
    var SECRET = FW.app.SECRET;
    var wrong = (SECRET.charAt(0) === 'Q') ? 'Z' : 'Q';

    setValue(input, '');          // 从空开始，免得接着面板里那个随机种子往后接

    // 1) 正常只收数字
    var got = typeChar(input, '7');
    if (got !== '7') problems.push('数字没被接受: [' + got + ']');
    var got2 = typeChar(input, wrong);
    if (got2 !== '7') problems.push('数字后面接字母应被弹回: [' + got2 + ']');
    setValue(input, '');

    // 2) 错的首字母：必须进不去
    got = typeChar(input, wrong);
    if (got !== '') problems.push('错的首字母应当进不去，实际长度 ' + got.length);
    steps.push('错首字母 -> 框内长度 ' + got.length + '（应为 0）');

    // 3) 对的首字母：必须留下来
    got = typeChar(input, SECRET.charAt(0));
    if (got !== SECRET.slice(0, 1)) problems.push('对的首字母应当留下，实际长度 ' + got.length);
    steps.push('对首字母 -> 长度 ' + got.length + '（正确前缀）');

    // 4) 中途敲错：应退回上一个正确前缀
    var wrongMid = (SECRET.charAt(1) === 'X') ? 'Y' : 'X';
    got = typeChar(input, wrongMid);
    if (got !== SECRET.slice(0, 1)) problems.push('中途敲错应退回前缀，实际长度 ' + got.length);
    steps.push('中间敲错 -> 回退到长度 ' + got.length);

    // 5) 敲完剩下的：应当解锁参考图风格
    for (var i = 1; i < SECRET.length; i++) typeChar(input, SECRET.charAt(i));
    if (input.value !== SECRET) problems.push('敲完密语后框里应是密语，实际长度 ' + input.value.length);
    if (app.scene !== 'classic') problems.push('敲完密语后场景应是 classic，实际 ' + app.scene);
    if (!app.secretFound) problems.push('敲完密语后 secretFound 应为 true');
    steps.push('敲完 ' + SECRET.length + ' 个字母 -> 场景 ' + app.scene);

    // 6) 多敲一个字符：不该再进去
    got = typeChar(input, 'A');
    if (got !== SECRET) problems.push('密语之后再敲字符应被弹回，实际长度 ' + got.length);

    // 7) 清空换数字：应回到纯随机
    setValue(input, '42');
    input.dispatchEvent(new Event('change', { bubbles: true }));
    if (app.scene !== 'random') problems.push('换成数字种子后场景应是 random，实际 ' + app.scene);
    steps.push('换数字 42 -> 场景 ' + app.scene);

    done();
  }

  var tries = 0, ran = false;
  function wait() {
    if (ran) return;             // load 事件与首次轮询都会调到这里，只跑一次
    var win;
    try { win = frame.contentWindow; } catch (e) { win = null; }
    if (win && win.FW && win.FW.app && win.FW.app.instance) { ran = true; run(win); return; }
    if (++tries > 120) { ran = true; problems.push('等不到 iframe 里的 App 实例'); done(); return; }
    setTimeout(wait, 100);
  }
  frame.addEventListener('load', wait);
  wait();
})();
</script>
</body>
