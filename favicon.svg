<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="烟花">
  <!--
    烟花 · Fireworks —— 橙色系一发：夜空小方块 + 居中的花型。
    上下长度大致平衡（只留一点上偏），爆心在中线上，所以整发在方块里是居中的；
    16px 下也要认得出是烟花，所以射线少而粗、核心亮。
  -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#2a1c3a" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#080c1c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#080c1c"/>
  <rect width="64" height="64" rx="13" fill="url(#sky)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="12.4" fill="none"
        stroke="#ffb347" stroke-opacity=".18" stroke-width="1.2"/>

  <!-- 远处的几颗火星：大尺寸下添生气，16px 下自然糊掉 -->
  <g fill="#ffb347">
    <circle cx="14" cy="14.5" r="1.7" opacity=".5"/>
    <circle cx="50.5" cy="13" r="1.4" opacity=".42"/>
    <circle cx="49" cy="47.5" r="1.5" opacity=".35"/>
    <circle cx="14.5" cy="46" r="1.3" opacity=".3"/>
  </g>

  <g transform="translate(32 31) scale(.93) translate(-32 -31)">
    <g stroke="#f2600c" stroke-linecap="round">
      <line x1="31.28" y1="25.85" x2="29.29" y2="11.69" stroke-width="3.8"/>
      <line x1="35.74" y1="27.39" x2="44.95" y2="18.5" stroke-width="3.8"/>
      <line x1="27.18" y1="29.05" x2="16.24" y2="24.63" stroke-width="3.6"/>
      <line x1="37.2" y1="30.82" x2="50.99" y2="30.34" stroke-width="3.8"/>
      <line x1="27.69" y1="33.91" x2="19.15" y2="39.67" stroke-width="3.6"/>
      <line x1="35.06" y1="35.21" x2="41.7" y2="44.35" stroke-width="3.7"/>
      <line x1="30.74" y1="36.05" x2="28.37" y2="45.55" stroke-width="3.9"/>
    </g>
    <g>
      <circle cx="44.95" cy="18.5" r="3.6" fill="#ffec8a"/>
      <circle cx="16.24" cy="24.63" r="3.0" fill="#ffe066"/>
      <circle cx="50.99" cy="30.34" r="3.4" fill="#ffec8a"/>
      <circle cx="41.7" cy="44.35" r="3.0" fill="#ffe066"/>
    </g>
    <circle cx="32" cy="31" r="8.2" fill="#ff9a2e" opacity=".4"/>
    <circle cx="32" cy="31" r="5.2" fill="#ffd98a"/>
    <circle cx="32" cy="31" r="3.2" fill="#fff8ec"/>
  </g>
</svg>
