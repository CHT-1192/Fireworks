<!--
  烟花 · Fireworks —— 单文件版（由 npm run build 生成，请勿直接编辑）
  改动请改 index.html 与 src/*.js，然后重新 npm run build。
  模块: core.js -> rng.js -> data.js -> elements.js -> trails.js -> firework.js -> show.js -> view.js -> app.js -> record.js -> ui.js
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烟花 · Fireworks</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #000020; color: #d7e5ff;
    font: 13px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  [hidden] { display: none !important; }

  /* ---------------------------------------------------------- 控制台 */
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 3; width: 272px;
    padding: 14px; border-radius: 14px;
    background: rgba(6, 10, 30, .74); backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 160, 255, .18);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  #panel h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  #panel label {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin: 9px 0; color: rgba(190, 210, 255, .78); font-size: 12px;
  }
  #panel .row { display: flex; gap: 6px; margin: 9px 0; }
  #panel .row button { flex: 1; }
  /* 面板里的表单控件统一外观（滑块与勾选框另有规则）。
     注意别用 input[type=text] 这种具体选择器 —— 换一次 type 就会漏掉样式。 */
  select, input:not([type=range]):not([type=checkbox]), button {
    font: inherit; font-size: 12px; color: #e6efff; padding: 5px 8px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(140, 170, 255, .26);
    border-radius: 8px; outline: none;
  }
  input[type=range] { flex: 1; accent-color: #ffd34d; min-width: 0; }
  input:focus, select:focus { border-color: rgba(255, 211, 77, .6); }
  button:focus-visible { border-color: rgba(255, 211, 77, .6); }
  #seed {
    flex: 1; width: auto; text-align: center; letter-spacing: 2px; font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase;
    transition: border-color .15s;
  }
  /* 敲错字母时抖一下：这就是"试探"的反馈 */
  @keyframes seed-reject { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); }
                           70% { transform: translateX(4px); } }
  #seed.reject { animation: seed-reject .22s; border-color: rgba(255, 138, 138, .85); }
  button { cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  button:hover { background: rgba(140, 170, 255, .2); border-color: rgba(160, 190, 255, .5); }
  button:active { transform: translateY(1px); }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: #ffd34d; cursor: pointer; }
  #budget-val { width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: #ffd98a; }
  #panel .help { margin: -4px 0 10px; font-size: 11px; line-height: 1.6; color: rgba(170, 195, 255, .5); }
  #panel .hint {
    margin: 12px 0 0; padding-top: 10px; font-size: 11px; line-height: 1.7;
    color: rgba(170, 195, 255, .48); border-top: 1px solid rgba(120, 160, 255, .12);
    overflow-wrap: anywhere;
  }

  #rec {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 4;

  }
  #rec i { width: 9px; height: 9px; border-radius: 50%; background: #ff5a5a;
           animation: rec-pulse 1s ease-in-out infinite; }
  @keyframes rec-pulse { 50% { opacity: .2; } }

  /* --------------------------------------------------------------- HUD */
  #hud {
    position: fixed; top: 12px; right: 12px; z-index: 2; padding: 10px 12px;
    border-radius: 12px; text-align: right; font-size: 12px; line-height: 1.75;

    font-variant-numeric: tabular-nums;
  }
  #hud .k { color: rgba(170, 195, 255, .5); margin-right: 6px; }
  #hud b { font-weight: 600; color: #ffd98a; }

<script>
/* 兜底自检：如果 1.5 秒后 App 还没被创建出来，就**把原因写在页面上**。
   一个模块都没加载完 / 入口模块没加载 / 直接双击了未构建的 index.html，
   这几种情况的共同表现是"空白画面 + 控制台零输出"，没有提示根本无从下手。 */
setTimeout(function () {
  var fw = window.FW || {};
  if (fw.app && fw.app.instance) return;                 // 一切正常
  var have = Object.keys(fw);
  var why = !fw.app
    ? '模块没加载完（连 app.js 都没到）。若你是直接双击 index.html：请用 <b>npm start</b>，'
      + '或打开构建好的 <b>dist/turtle_fireworks.html</b>。'
    : '入口模块 ui.js 没执行。检查它是不是 404（src/manifest.json 里列了但文件不在 / 名字写错）'
      + '或加载时报错 —— 这两种情况都会让页面什么都不构造。';
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'
    + 'max-width:min(540px,86vw);padding:18px 20px;border-radius:14px;z-index:9;'
    + 'background:rgba(6,10,30,.94);border:1px solid rgba(255,138,138,.55);'
    + 'color:#ffd7d7;font:13px/1.75 system-ui,-apple-system,"PingFang SC",sans-serif';
  box.innerHTML = '<b style="font-size:15px">烟花没起来</b><br>'
    + '1.5 秒内没有创建出 App 实例。<br>' + why
    + '<br><br><span style="color:rgba(255,215,215,.65)">已加载的模块：'
    + (have.length ? have.join(', ') : '（一个都没有）')
    + '<br>具体报错请看浏览器控制台。</span>';
  document.body.appendChild(box);
}, 1500);
</script>

<script>
/* ===================== src/core.js ===================== */
/* ============================================================================
 * core.js —— 数学 / 颜色基础件
 * 对应 turtle_fireworks.py 的「颜色小工具」一节。
 * 纯计算，不碰 DOM：Node 侧的复刻校验脚本也会加载它。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var TAU = Math.PI * 2;
  var RAD2DEG = 180 / Math.PI;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /** HSV(0..1) -> RGB(0..1)；与 Python colorsys.hsv_to_rgb 同口径。 */
  function hsv(h, s, v) {
    h = ((h % 1) + 1) % 1;
    s = clamp(s, 0, 1);
    v = clamp(v, 0, 1);
    var i = Math.floor(h * 6);
    var f = h * 6 - i;
    var p = v * (1 - s);
    var q = v * (1 - f * s);
    var t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  /** 夜空背景，取自参考图 #000020。 */
  var BG = hsv(2 / 3, 1.0, 0.125);

  /**
   * 变暗 = 朝背景色淡出（k=1 原色，k=0 与背景一模一样）。
   * 比单纯乘系数干净：将熄的火花不会在深蓝夜空上留一圈灰黑残影。
   */
  function fade(c, k) {
    if (k <= 0) return BG;
    if (k >= 1) return c;
    return [BG[0] + (c[0] - BG[0]) * k,
            BG[1] + (c[1] - BG[1]) * k,
            BG[2] + (c[2] - BG[2]) * k];
  }

  /** 两色线性插值。 */
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t];
  }

  /** Python 的 round()：四舍六入五取偶（banker's rounding）。 */
  function pyRound(x) {
    var f = Math.floor(x);
    var d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }

  /** RGB(0..1) -> '#rrggbb'；顺手夹掉越界 / NaN。 */
  function toHex(c) {
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = c[i];
      if (!(v === v) || v < 0) v = 0; else if (v > 1) v = 1;
      out += (pyRound(v * 255) + 0x100).toString(16).slice(1);
    }
    return out;
  }

  /** 把一长串轨迹点均匀抽稀到最多 segMax 段，控制每帧要画多少图元。 */
  function decimate(pts, segMax) {
    var n = pts.length;
    if (n <= segMax + 1) return pts;
    var out = new Array(segMax + 1);
    for (var i = 0; i <= segMax; i++) out[i] = pts[pyRound(i * (n - 1) / segMax)];
    return out;
  }

  FW.core = {
    TAU: TAU, RAD2DEG: RAD2DEG, clamp: clamp, hsv: hsv, BG: BG,
    fade: fade, mix: mix, pyRound: pyRound, toHex: toHex, decimate: decimate
  };
})(globalThis.FW || (globalThis.FW = {}));

/* ===================== src/rng.js ===================== */
/* ============================================================================
 * rng.js —— MT19937，逐位对齐 CPython 的 random.Random
 * ---------------------------------------------------------------------------
 * 原版用 random.Random(seed) 决定整场演出的位置/颜色/寿命。这里把 Mersenne
 * Twister 和 CPython 的播种（init_by_array）一起搬过来，所以**同一个 seed 在
 * Python 与浏览器里放出的是同一场烟花**（tools/verify.js 会逐位校验）。
 *   random()  -> genrand_res53（两个 32bit 拼 53bit）
 *   randint / randrange / choice -> _randbelow_with_getrandbits
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var N = 624, M = 397;
  var MATRIX_A = 0x9908b0df, UPPER = 0x80000000, LOWER = 0x7fffffff;

  /** 整数种子（含任意长的数字串）-> init_by_array 的 key，与 CPython 完全一致。 */
  function seedToKey(value) {
    var v;
    if (typeof value === 'bigint') v = value;
    else {
      var text = String(value).trim();
      v = /^[+-]?\d+$/.test(text) ? BigInt(text)          // 大整数也精确，不经过 Number
                                  : BigInt(Math.trunc(Number(value)));
    }
    if (v < 0n) v = -v;                            // CPython 也取绝对值
    var key = [];
    if (v === 0n) key.push(0);                     // seed 0 -> key = [0]
    while (v > 0n) { key.push(Number(v & 0xffffffffn)); v >>= 32n; }
    return key;

  /** 种子是不是"纯数字"（决定它与 CPython 逐位一致、以及用哪个场景）。 */
  function isNumericSeed(value) { return /^[+-]?\d+$/.test(String(value).trim()); }

  /**
   * 字母/文字种子 -> 32 位无符号整数（FNV-1a）。
   * 这是**本版自定义**的映射（Python 那边没有对应物）：同一个字符串永远得到同一个
   * 数字，所以字母种子同样可复现、可分享 —— 只是不再和 CPython 逐位对齐。
   */
  function hashSeed(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h;
  }


  function bitLength(n) {
    var k = 0;
    while (n > 0) { n = Math.floor(n / 2); k++; }
    return k;
  }

  function defaultSeed() { return 1 + Math.floor(Math.random() * 999999); }

  function Random(seed) {
    this.mt = new Uint32Array(N);
    this.mti = N + 1;
    this.seed(seed === undefined || seed === null ? defaultSeed() : seed);
  }

  /** 数字种子与 CPython 逐位一致；含字母的种子先 FNV-1a 哈希成数字再用。 */
  Random.prototype.seed = function (value) {
    var text = String(value).trim();
    this.initByArray(seedToKey(isNumericSeed(text) ? text : hashSeed(text)));
    return this;
  };

  Random.prototype.initGenrand = function (s) {
    var mt = this.mt;
    mt[0] = s >>> 0;
    for (var i = 1; i < N; i++) {
      var prev = mt[i - 1];
      mt[i] = (Math.imul(1812433253, prev ^ (prev >>> 30)) + i) >>> 0;
    }
    this.mti = N;
  };

  Random.prototype.initByArray = function (key) {
    var mt = this.mt, kl = key.length, i = 1, j = 0, k, prev;
    this.initGenrand(19650218);
    for (k = Math.max(N, kl); k; k--) {
      prev = mt[i - 1];
      mt[i] = ((mt[i] ^ Math.imul(prev ^ (prev >>> 30), 1664525)) + key[j] + j) >>> 0;
      i++; j++;
      if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
      if (j >= kl) j = 0;
    }
    for (k = N - 1; k; k--) {
      prev = mt[i - 1];
      mt[i] = ((mt[i] ^ Math.imul(prev ^ (prev >>> 30), 1566083941)) - i) >>> 0;
      i++;
      if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
    }
    mt[0] = 0x80000000;
  };

  /** MT19937 的 genrand_uint32：twist + temper。 */
  Random.prototype.genrandUint32 = function () {
    var mt = this.mt, y, kk;
    if (this.mti >= N) {
      if (this.mti === N + 1) this.initGenrand(5489);      // 兜底，正常播种不会走到
      for (kk = 0; kk < N - M; kk++) {
        y = (mt[kk] & UPPER) | (mt[kk + 1] & LOWER);
        mt[kk] = mt[kk + M] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      }
      for (; kk < N - 1; kk++) {
        y = (mt[kk] & UPPER) | (mt[kk + 1] & LOWER);
        mt[kk] = mt[kk + (M - N)] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      }
      y = (mt[N - 1] & UPPER) | (mt[0] & LOWER);
      mt[N - 1] = mt[M - 1] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      this.mti = 0;
    }
    y = mt[this.mti++];
    y ^= y >>> 11;
    y ^= (y << 7) & 0x9d2c5680;
    y ^= (y << 15) & 0xefc60000;
    y ^= y >>> 18;
    return y >>> 0;
  };

  /** random.random() = genrand_res53。 */
  Random.prototype.random = function () {
    var a = this.genrandUint32() >>> 5;
    var b = this.genrandUint32() >>> 6;
    return (a * 67108864 + b) / 9007199254740992;
  };

  /** getrandbits(k)：k<=32 与 CPython 完全一致；更大的 k 走 BigInt 精确拼装。 */
  Random.prototype.getrandbits = function (k) {
    if (k <= 0) throw new RangeError('number of bits must be greater than zero');
    if (k <= 32) return this.genrandUint32() >>> (32 - k);
    var acc = 0n, shift = 0n, left = k;
    while (left > 0) {
      var w = this.genrandUint32();
      if (left < 32) w >>>= (32 - left);
      acc |= BigInt(w) << shift;
      shift += 32n; left -= 32;
    }
    return Number(acc);
  };

  Random.prototype.randbelow = function (n) {
    var k = bitLength(n), r = this.getrandbits(k);
    while (r >= n) r = this.getrandbits(k);
    return r;
  };

/* ===================== src/data.js ===================== */
/* ============================================================================
 * data.js —— 配色 / 形状 / 花型参数 / 原版复刻实测数据
 * 对应 turtle_fireworks.py 的「原版复刻数据」「自定义形状 + 图元」两节，
 * 以及 STYLES 表。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var hsv = FW.core.hsv, TAU = FW.core.TAU;

  /* ---------------------------------------------------------------- 配色 */

  /** Palette(name, dot, ray, stem, core)：圆点 / 射线 / 发射尾迹 / 爆心闪光。 */
  function Palette(name, dot, ray, stem, core) {
    return { name: name, dot: dot, ray: ray, stem: stem, core: core };
  }

  //: 参考图两发烟花的配色（颜色取自截图采样）
  var HALLOWEEN = Palette('halloween', hsv(0.167, 1.0, 0.88), hsv(0.003, 0.94, 0.88),
                          hsv(0.031, 0.85, 0.94), hsv(0.10, 0.25, 1.0));
  var MATRIX = Palette('matrix', hsv(1 / 3, 1.0, 1.0), hsv(1 / 3, 1.0, 0.5),
                       hsv(1 / 3, 1.0, 0.5), hsv(1 / 3, 0.2, 1.0));

  /** 随机配色：同色系 / 冷暖撞色 / 互补色，三种套路（取值顺序要与 Python 一致）。 */
  function randomPalette(rng) {
    var h = rng.random(), roll = rng.random();
    var dot, ray, stem;
    if (roll < 0.30) {                                   // 同色系
      dot = hsv(h, rng.uniform(0.85, 1.0), 1.0);
      ray = hsv(h, 1.0, rng.uniform(0.45, 0.72));
      stem = hsv(h, 1.0, rng.uniform(0.70, 0.95));

      if (!FW.app.seedContentOk(text)) {          // 既不是数字，也不是那个词的前缀
        this.value = lastValid;
        this.classList.remove('reject');
        void this.offsetWidth;                    // 强制重排，动画才会重播
        this.classList.add('reject');
        clearTimeout(self.rejectTimer);
        self.rejectTimer = setTimeout(function () { input.classList.remove('reject'); }, 240);
        return;
      }
      lastValid = text;
      this.value = text;
      if (text === FW.app.SECRET) {               // 拼全了：换成参考图风格
        self.rebuild(undefined, text);
        console.log('%c' + FW.app.SECRET + ' —— 参考图风格', 'color:#ffd34d;font-weight:700');
      }
    });

    // 聚焦就全选：想换种子直接敲，不用先手动删掉旧的
    input.addEventListener('focus', function () { this.select(); });

    // 回车 = 敲完了：收起焦点，快捷键随即恢复（否则 R 还会被当成在打字）
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') this.blur();
    });

    // 数字种子在失焦 / 回车时生效（免得每敲一位就重开一场）
    input.addEventListener('change', function () {
      if (/^\d+$/.test(this.value)) self.rebuild(undefined, this.value);
      else if (this.value === '') self.reseed();
    });
  };

  FW.app.App.prototype.bindPanel = function () {
    var self = this;
    this.bindSeedInput();
    $('dice-number').addEventListener('click', function () { self.reseed(); });
    $('pause').addEventListener('click', function () { self.togglePause(); });
    $('extra').addEventListener('click', function () { self.extra(); });
    $('replay').addEventListener('click', function () { self.rebuild(self.scene, self.seed); });
    $('save').addEventListener('click', function () { self.savePng(); });
    $('hide').addEventListener('click', function () { self.toggleUi(); });
    $('record').addEventListener('click', function () { self.toggleRecord(); });
    $('rec-stop').addEventListener('click', function () { self.stopRecord(); });
    // 点一下画面 = 我看完了：把焦点从种子框收回，R 之类立刻恢复
    this.canvas.addEventListener('pointerdown', function () {
      var el = document.activeElement;
      if (el && el.id === 'seed') el.blur();
    });
    $('show').addEventListener('click', function () { self.toggleUi(); });
    $('budget').addEventListener('input', function () {
      self.maxGeos = parseInt(this.value, 10);
      self.show.maxGeos = self.maxGeos;
      $('budget-val').textContent = self.maxGeos;
    });
  };

  FW.app.App.prototype.bindKeys = function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      // Esc 永远有效（它不会往输入框里塞字符）；录制中先停录制
      if (e.key === 'Escape') {
        if (self.recorder && self.recorder.recording()) self.stopRecord();
        else self.toggleUi();
        return;
      }
      // 只有"真的在往里打字"的控件才让出快捷键。原来是 input/select/textarea 一概
      // 让位 —— 而「绘制预算」滑块本身就是 <input>，拖完滑块再按 R 会毫无反应。
      var el = e.target || {};
      var tag = String(el.tagName || '').toLowerCase();
      var typing = (tag === 'textarea') || (tag === 'select')
        || (tag === 'input'
            && /^(text|number|search|email|url|password|tel)$/.test(el.type || 'text'));
      if (typing) return;
      if (e.code === 'Space') { e.preventDefault(); self.togglePause(); }
      else if (e.key === 'r' || e.key === 'R') self.extra();
    });
  };

  FW.app.App.prototype.savePng = function () {
    var a = document.createElement('a');
    a.download = 'fireworks_' + this.scene + '_seed' + this.seed
               + '_t' + this.show.time.toFixed(2) + '.png';
    a.href = this.renderer.toDataURL();
    a.click();
  };

  /* --------------------------------------------------------------- 启动 */

  /**
   * 控制台里那张便条：只交代"种子框认数字"，顺口提一句那个词有几个字母，
   * 不点破是哪个词（剩下的靠往种子框里一个一个字母试，敲错了会被弹回来）。
   */
  function consoleNote(app) {
    var gold = 'color:#ffd34d;font-weight:600';
    var cyan = 'color:#7fd1ff;font-weight:600';
    console.log('%c烟花 · Fireworks', gold);
    console.log('seed %c' + app.seed, cyan);
    if (app.secretFound) return;
    console.log('种子框只收数字。有一个 %c' + FW.app.SECRET.length
      + ' 个字母%c的词是例外 —— 这里正在放的那个，一个一个敲试试。',
      'color:#ffd34d', 'color:inherit');
  }

  function boot() {
    var inst = new FW.app.App({
      canvas: $('stage'),
      search: new URLSearchParams(location.search)
    });
    FW.app.instance = inst;
    inst.start();
    consoleNote(inst);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(globalThis.FW || (globalThis.FW = {}));
</script>
</body>
</html>
