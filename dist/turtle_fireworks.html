<!--
  烟花 · Canvas 复刻版 —— 单文件版（由 npm run build 生成，请勿直接编辑）
  改动请改 index.html 与 src/*.js，然后重新 npm run build。
  模块: core.js -> rng.js -> data.js -> elements.js -> trails.js -> firework.js -> show.js -> view.js -> app.js
-->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>烟花 · Canvas（维护版）</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #000020; color: #d7e5ff;
    font: 13px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  [hidden] { display: none !important; }

  /* ---------------------------------------------------------- 控制台 */
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 3; width: 272px;
    padding: 14px; border-radius: 14px;
    background: rgba(6, 10, 30, .74); backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 160, 255, .18);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  #panel h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  #panel h1 span {
    font-size: 11px; font-weight: 400; letter-spacing: 0; margin-left: 4px;
    color: rgba(170, 195, 255, .55);
  }
  #panel label {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin: 9px 0; color: rgba(190, 210, 255, .78); font-size: 12px;
  }
  #panel .row { display: flex; gap: 6px; margin: 9px 0; }
  #panel .row button { flex: 1; }
  select, input[type=number], button {
    font: inherit; font-size: 12px; color: #e6efff; padding: 5px 8px;
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(140, 170, 255, .26);
    border-radius: 8px; outline: none;
  }
  select, input[type=number] { width: 96px; }
  input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  button:hover { background: rgba(140, 170, 255, .2); border-color: rgba(160, 190, 255, .5); }
  button:active { transform: translateY(1px); }
  input[type=range] { flex: 1; accent-color: #ffd34d; min-width: 0; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: #ffd34d; cursor: pointer; }
  #budget-val { width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: #ffd98a; }
  #panel .help { margin: -4px 0 10px; font-size: 11px; line-height: 1.6; color: rgba(170, 195, 255, .5); }
  #panel .hint {
    margin: 12px 0 0; padding-top: 10px; font-size: 11px; line-height: 1.7;
    color: rgba(170, 195, 255, .48); border-top: 1px solid rgba(120, 160, 255, .12);
    overflow-wrap: anywhere;
  }
  #panel code { color: rgba(255, 217, 138, .75); font-size: 10.5px; word-break: break-all; }
  #show { position: fixed; top: 12px; left: 12px; z-index: 3; }

  /* --------------------------------------------------------------- HUD */
  #hud {
    position: fixed; top: 12px; right: 12px; z-index: 2; padding: 10px 12px;
    border-radius: 12px; text-align: right; font-size: 12px; line-height: 1.75;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(6, 10, 30, .58); backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 160, 255, .14);
    font-variant-numeric: tabular-nums;
  }
  #hud .k { color: rgba(170, 195, 255, .5); margin-right: 6px; }
  #hud b { font-weight: 600; color: #ffd98a; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<aside id="panel">
  <h1>烟花<span>Canvas 维护版</span></h1>

  <label>场景
    <select id="scene">
      <option value="classic">参考图风格</option>
      <option value="original">原版复刻</option>
      <option value="random">纯随机</option>
    </select>
  </label>
  <p id="scene-help" class="help"></p>

  <label>种子
    <span>
      <input id="seed" type="number" min="0" max="999999" step="1">
      <button id="dice" title="随机换一个种子">随机</button>
    </span>
  </label>

  <div class="row">
    <button id="pause">暂停</button>
    <button id="extra" title="快捷键 R">放一发</button>
  </div>
  <div class="row">
    <button id="still" title="按截图实测坐标定格参考图那一帧">复刻单帧</button>
    <button id="replay" title="同一个 seed 从头再放一遍">重放本场</button>
  </div>
  <div class="row">
    <button id="save">存 PNG</button>
    <button id="hide">收起 UI</button>
  </div>

  <label>光滑尾迹
    <input id="dense" type="checkbox" checked>
  </label>

  <label>图元上限
    <input id="budget" type="range" min="30" max="300" step="10">
    <b id="budget-val">130</b>
  </label>

  <p class="hint">
    空格 暂停 / 继续 · R 放一发 · Esc 收起面板<br>
    URL 参数：<code>?scene=original&amp;still=1</code>（= 参考图那一帧）、
    <code>?frames=90</code>（定格第 90 帧）、<code>?ui=0</code>（无 UI 截图）、
    <code>?seed=7&amp;max=200</code><br>
    同一个 seed 就是同一场烟花，与 Python 原版逐位一致。<br>
    「光滑尾迹」只用 canvas 的圆头描边画得更细，不影响任何一颗火星；关掉（<code>?exact=1</code>）即回到原版 2~6 段折线的口径。
  </p>
</aside>

<button id="show" hidden>≡ 控制台</button>

<div id="hud">
  <div><span class="k">seed</span><b id="hud-seed">–</b></div>
  <div><span class="k">场景</span><b id="hud-scene">–</b></div>
  <div><span class="k">fps</span><b id="hud-fps">–</b></div>
  <div><span class="k">预算</span><b id="hud-budget">–</b></div>
  <div><span class="k">图元</span><b id="hud-geos">–</b></div>
  <div><span class="k">线段</span><b id="hud-segs">–</b></div>
  <div><span class="k">元素</span><b id="hud-els">–</b></div>
  <div><span class="k">在飞</span><b id="hud-fw">–</b></div>
  <div><span class="k">画布</span><b id="hud-wh">–</b></div>
  <div><span class="k">时刻</span><b id="hud-time">–</b></div>
  <div><span class="k">状态</span><b id="hud-state">–</b></div>
</div>

<noscript>这个页面需要 JavaScript。</noscript>

<script>
/* ===================== src/core.js ===================== */
/* ============================================================================
 * core.js —— 数学 / 颜色基础件
 * 对应 turtle_fireworks.py 的「颜色小工具」一节。
 * 纯计算，不碰 DOM：Node 侧的复刻校验脚本也会加载它。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var TAU = Math.PI * 2;
  var RAD2DEG = 180 / Math.PI;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /** HSV(0..1) -> RGB(0..1)；与 Python colorsys.hsv_to_rgb 同口径。 */
  function hsv(h, s, v) {
    h = ((h % 1) + 1) % 1;
    s = clamp(s, 0, 1);
    v = clamp(v, 0, 1);
    var i = Math.floor(h * 6);
    var f = h * 6 - i;
    var p = v * (1 - s);
    var q = v * (1 - f * s);
    var t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  /** 夜空背景，取自参考图 #000020。 */
  var BG = hsv(2 / 3, 1.0, 0.125);

  /**
   * 变暗 = 朝背景色淡出（k=1 原色，k=0 与背景一模一样）。
   * 比单纯乘系数干净：将熄的火花不会在深蓝夜空上留一圈灰黑残影。
   */
  function fade(c, k) {
    if (k <= 0) return BG;
    if (k >= 1) return c;
    return [BG[0] + (c[0] - BG[0]) * k,
            BG[1] + (c[1] - BG[1]) * k,
            BG[2] + (c[2] - BG[2]) * k];
  }

  /** 两色线性插值。 */
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t];
  }

  /** Python 的 round()：四舍六入五取偶（banker's rounding）。 */
  function pyRound(x) {
    var f = Math.floor(x);
    var d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }

  /** RGB(0..1) -> '#rrggbb'；顺手夹掉越界 / NaN。 */
  function toHex(c) {
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = c[i];
      if (!(v === v) || v < 0) v = 0; else if (v > 1) v = 1;
      out += (pyRound(v * 255) + 0x100).toString(16).slice(1);
    }
    return out;
  }

  /** 把一长串轨迹点均匀抽稀到最多 segMax 段，控制每帧要画多少图元。 */
  function decimate(pts, segMax) {
    var n = pts.length;
    if (n <= segMax + 1) return pts;
    var out = new Array(segMax + 1);
    for (var i = 0; i <= segMax; i++) out[i] = pts[pyRound(i * (n - 1) / segMax)];
    return out;
  }

  FW.core = {
    TAU: TAU, RAD2DEG: RAD2DEG, clamp: clamp, hsv: hsv, BG: BG,
    fade: fade, mix: mix, pyRound: pyRound, toHex: toHex, decimate: decimate
  };
})(globalThis.FW || (globalThis.FW = {}));

/* ===================== src/rng.js ===================== */
/* ============================================================================
 * rng.js —— MT19937，逐位对齐 CPython 的 random.Random
 * ---------------------------------------------------------------------------
 * 原版用 random.Random(seed) 决定整场演出的位置/颜色/寿命。这里把 Mersenne
 * Twister 和 CPython 的播种（init_by_array）一起搬过来，所以**同一个 seed 在
 * Python 与浏览器里放出的是同一场烟花**（tools/verify.js 会逐位校验）。
 *   random()  -> genrand_res53（两个 32bit 拼 53bit）
 *   randint / randrange / choice -> _randbelow_with_getrandbits
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var N = 624, M = 397;
  var MATRIX_A = 0x9908b0df, UPPER = 0x80000000, LOWER = 0x7fffffff;

  function seedToKey(value) {
    var v = (typeof value === 'bigint') ? value : BigInt(Math.trunc(Number(value)));
    if (v < 0n) v = -v;
    var key = [];
    if (v === 0n) key.push(0);                     // seed 0 -> key = [0]
    while (v > 0n) { key.push(Number(v & 0xffffffffn)); v >>= 32n; }
    return key;
  }

  function bitLength(n) {
    var k = 0;
    while (n > 0) { n = Math.floor(n / 2); k++; }
    return k;
  }

  function defaultSeed() { return 1 + Math.floor(Math.random() * 999999); }

  function Random(seed) {
    this.mt = new Uint32Array(N);
    this.mti = N + 1;
    this.seed(seed === undefined || seed === null ? defaultSeed() : seed);
  }

  Random.prototype.seed = function (value) {
    this.initByArray(seedToKey(value));
    return this;
  };

  Random.prototype.initGenrand = function (s) {
    var mt = this.mt;
    mt[0] = s >>> 0;
    for (var i = 1; i < N; i++) {
      var prev = mt[i - 1];
      mt[i] = (Math.imul(1812433253, prev ^ (prev >>> 30)) + i) >>> 0;
    }
    this.mti = N;
  };

  Random.prototype.initByArray = function (key) {
    var mt = this.mt, kl = key.length, i = 1, j = 0, k, prev;
    this.initGenrand(19650218);
    for (k = Math.max(N, kl); k; k--) {
      prev = mt[i - 1];
      mt[i] = ((mt[i] ^ Math.imul(prev ^ (prev >>> 30), 1664525)) + key[j] + j) >>> 0;
      i++; j++;
      if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
      if (j >= kl) j = 0;
    }
    for (k = N - 1; k; k--) {
      prev = mt[i - 1];
      mt[i] = ((mt[i] ^ Math.imul(prev ^ (prev >>> 30), 1566083941)) - i) >>> 0;
      i++;
      if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
    }
    mt[0] = 0x80000000;
  };

  /** MT19937 的 genrand_uint32：twist + temper。 */
  Random.prototype.genrandUint32 = function () {
    var mt = this.mt, y, kk;
    if (this.mti >= N) {
      if (this.mti === N + 1) this.initGenrand(5489);      // 兜底，正常播种不会走到
      for (kk = 0; kk < N - M; kk++) {
        y = (mt[kk] & UPPER) | (mt[kk + 1] & LOWER);
        mt[kk] = mt[kk + M] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      }
      for (; kk < N - 1; kk++) {
        y = (mt[kk] & UPPER) | (mt[kk + 1] & LOWER);
        mt[kk] = mt[kk + (M - N)] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      }
      y = (mt[N - 1] & UPPER) | (mt[0] & LOWER);
      mt[N - 1] = mt[M - 1] ^ (y >>> 1) ^ ((y & 1) ? MATRIX_A : 0);
      this.mti = 0;
    }
    y = mt[this.mti++];
    y ^= y >>> 11;
    y ^= (y << 7) & 0x9d2c5680;
    y ^= (y << 15) & 0xefc60000;
    y ^= y >>> 18;
    return y >>> 0;
  };

  /** random.random() = genrand_res53。 */
  Random.prototype.random = function () {
    var a = this.genrandUint32() >>> 5;
    var b = this.genrandUint32() >>> 6;
    return (a * 67108864 + b) / 9007199254740992;
  };

  /** getrandbits(k)：k<=32 与 CPython 完全一致；更大的 k 走 BigInt 精确拼装。 */
  Random.prototype.getrandbits = function (k) {
    if (k <= 0) throw new RangeError('number of bits must be greater than zero');
    if (k <= 32) return this.genrandUint32() >>> (32 - k);
    var acc = 0n, shift = 0n, left = k;
    while (left > 0) {
      var w = this.genrandUint32();
      if (left < 32) w >>>= (32 - left);
      acc |= BigInt(w) << shift;
      shift += 32n; left -= 32;
    }
    return Number(acc);
  };

  /** _randbelow_with_getrandbits：拒绝采样。 */
  Random.prototype.randbelow = function (n) {
    var k = bitLength(n), r = this.getrandbits(k);
    while (r >= n) r = this.getrandbits(k);
    return r;
  };

  Random.prototype.randrange = function (a, b, step) {
    if (b === undefined) { b = a; a = 0; }
    step = step === undefined ? 1 : step;
    var width = Math.ceil((b - a) / step);
    return a + step * this.randbelow(width);
  };

  Random.prototype.randint = function (a, b) { return a + this.randbelow(b - a + 1); };

  Random.prototype.uniform = function (a, b) { return a + (b - a) * this.random(); };

  Random.prototype.choice = function (seq) { return seq[this.randbelow(seq.length)]; };

  FW.rng = { Random: Random, defaultSeed: defaultSeed };
})(globalThis.FW || (globalThis.FW = {}));

/* ===================== src/data.js ===================== */
/* ============================================================================
 * data.js —— 配色 / 形状 / 花型参数 / 原版复刻实测数据
 * 对应 turtle_fireworks.py 的「原版复刻数据」「自定义形状 + 图元」两节，
 * 以及 STYLES 表。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var hsv = FW.core.hsv, TAU = FW.core.TAU;

  /* ---------------------------------------------------------------- 配色 */

  /** Palette(name, dot, ray, stem, core)：圆点 / 射线 / 发射尾迹 / 爆心闪光。 */
  function Palette(name, dot, ray, stem, core) {
    return { name: name, dot: dot, ray: ray, stem: stem, core: core };
  }

  //: 参考图两发烟花的配色（颜色取自截图采样）
  var HALLOWEEN = Palette('halloween', hsv(0.167, 1.0, 0.88), hsv(0.003, 0.94, 0.88),
                          hsv(0.031, 0.85, 0.94), hsv(0.10, 0.25, 1.0));
  var MATRIX = Palette('matrix', hsv(1 / 3, 1.0, 1.0), hsv(1 / 3, 1.0, 0.5),
                       hsv(1 / 3, 1.0, 0.5), hsv(1 / 3, 0.2, 1.0));

  /** 随机配色：同色系 / 冷暖撞色 / 互补色，三种套路（取值顺序要与 Python 一致）。 */
  function randomPalette(rng) {
    var h = rng.random(), roll = rng.random();
    var dot, ray, stem;
    if (roll < 0.30) {                                   // 同色系
      dot = hsv(h, rng.uniform(0.85, 1.0), 1.0);
      ray = hsv(h, 1.0, rng.uniform(0.45, 0.72));
      stem = hsv(h, 1.0, rng.uniform(0.70, 0.95));
    } else if (roll < 0.72) {                            // 冷暖撞色
      dot = hsv(h, rng.uniform(0.85, 1.0), 1.0);
      ray = hsv(h + 0.5 + rng.uniform(-0.09, 0.09), 0.95, rng.uniform(0.72, 0.95));
      stem = hsv(h + rng.uniform(-0.05, 0.05), 1.0, rng.uniform(0.85, 1.0));
    } else {                                             // 邻近色
      dot = hsv(h, rng.uniform(0.7, 1.0), 1.0);
      ray = hsv(h + rng.uniform(0.06, 0.16), 1.0, rng.uniform(0.6, 0.9));
      stem = hsv(h + rng.uniform(-0.10, -0.03), 1.0, 0.95);
    }
    return Palette('random', dot, ray, stem, hsv(h, 0.18, 1.0));
  }

  /* ------------------------------------------------- 自定义形状 / 图元 */

  var DOT = 'fw_dot', RAY = 'fw_ray', PATH = 'fw_path', DOT_SIDES = 18;

  /** 单位圆点（半径 1，正 18 边形），按 (wid, leng) 缩放后就是任意大小的圆点。 */
  var DOT_PTS = (function () {
    var pts = new Array(DOT_SIDES);
    for (var i = 0; i < DOT_SIDES; i++) {
      var a = TAU * i / DOT_SIDES;
      pts[i] = [Math.cos(a), Math.sin(a)];
    }
    return pts;
  })();

  /**
   * 单位线段：x∈[-1,1] 是粗细，y∈[0,1] 是长度。
   * turtle 里形状的 +y 轴才是「乌龟正前方」，所以长度方向放在 y 上；
   * 画到 canvas 时用 (wid, leng) 缩放 + heading 旋转得到任意角度/长度/粗细。
   */
  var RAY_PTS = [[-1.0, 0.0], [1.0, 0.0], [1.0, 1.0], [-1.0, 1.0]];
  var SHAPES = {};
  SHAPES[DOT] = DOT_PTS;
  SHAPES[RAY] = RAY_PTS;

  /** 一个待绘制的图元：字段顺序与 Python 的 Geo NamedTuple 一致。 */
  function geo(shape, color, x, y, heading, wid, leng) {
    return {
      shape: shape, color: color, x: x, y: y,
      heading: heading === undefined ? 0.0 : heading,
      wid: wid === undefined ? 1.0 : wid,
      leng: leng === undefined ? 1.0 : leng
    };
  }

  /** 单段射线（原版口径）：由 [x0, y0, x1, y1, color, half] 直接生成一个 RAY 图元。 */
  function rayGeo(s) {
    var dx = s[2] - s[0], dy = s[3] - s[1];
    return geo(RAY, s[4], s[0], s[1], Math.atan2(dy, dx) * FW.core.RAD2DEG,
               s[5], Math.hypot(dx, dy));
  }

  /**
   * **折线图元**：把整条尾迹的多段打包成一个图元，交给 canvas 用圆头圆角一次
   * 描边连成光滑带子。这是原版做不到的事 —— turtle 没有"带粗细的折线"，只能
   * 一段轨迹盖一个矩形图章，所以尾迹看着是一节一节的，弯道处还会折成多边形。
   *
   * segs 与单段射线同格式：[[x0, y0, x1, y1, color, half], ...]
   * cost = 这一帧它在 **Python 口径**下算几个图元。图元预算 / 密度节流仍按原版
   *        口径统计，所以"画得更细"不会改变任何一颗火星的位置与随机数消耗 ——
   *        同 seed 依然是同一场。这是**兼容层**（服务于行为基线与原版对拍），
   *        新特性不必继承这个口径。
   */
  function pathGeo(segs, cost) { return { shape: PATH, segs: segs, cost: cost }; }

  /** 增强模式的细采样上限（段）：远超原版的图章预算，肉眼已看不出折线。 */

    ctx.setTransform(s * sn * this.dpr, s * cs * this.dpr,
                     s * cs * this.dpr, -s * sn * this.dpr,
                     (this.ox + s * g.x) * this.dpr, (this.oy - s * g.y) * this.dpr);
    ctx.fillStyle = toHex(g.color);
    var pts, i, X, Y;
    if (g.shape === DOT) {
      pts = DOT_PTS;
      ctx.beginPath();
      for (i = 0; i < pts.length; i++) {
        X = pts[i][0] * g.wid; Y = pts[i][1] * g.leng;
        if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // 单位线段：x∈[-1,1] 是粗细，y∈[0,1] 是长度
      X = g.wid; Y = g.leng;
      ctx.beginPath();
      ctx.moveTo(RAY_PTS[0][0] * X, RAY_PTS[0][1] * Y);
      ctx.lineTo(RAY_PTS[1][0] * X, RAY_PTS[1][1] * Y);
      ctx.lineTo(RAY_PTS[2][0] * X, RAY_PTS[2][1] * Y);
      ctx.lineTo(RAY_PTS[3][0] * X, RAY_PTS[3][1] * Y);
      ctx.closePath();
      ctx.fill();

  /** 导出 PNG 用的 dataURL（浏览器 Canvas 自带，不用手写 zlib/PNG）。 */
  Renderer.prototype.toDataURL = function () { return this.canvas.toDataURL('image/png'); };

  FW.view = { Renderer: Renderer };

/* ===================== src/app.js ===================== */
/* ============================================================================
 * app.js —— 浏览器外壳：固定步长主循环 + 键盘 / 控制台 + HUD
 * 对应 turtle_fireworks.py 的 TurtleApp 与命令行一节。
 * ---------------------------------------------------------------------------
 * 和原版的两处有意的差别：
 *   * 原版用 ontimer + 实测帧间隔 dt 推进（帧率抖动会改变整场演出）；
 *     这里改成**固定 1/60 步长 + 累加器**，所以「同 seed = 同一场」在浏览器里
 *     是严格成立的，也正好对上原版 --render 的固定步长。
 *   * original 场景的逻辑坐标固定为参考图的 924×691，窗口再大也是完整构图
 *     （等比缩放居中），而不是被裁掉。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var FIXED_DT = 1 / 60;                 // 固定步长（= 原版 --render 的 60fps）
  var MAX_STEPS = 4;                     // 单帧最多追几步，避免掉帧后雪崩
  var DT_CLAMP = 0.06;                   // 单帧最多推进 60ms（同原版）
  var ORIGINAL = FW.data.ORIGINAL;

  var SCENES = {
    classic: ['参考图风格', '按参考图的配色/花型开场，随后继续随机放'],
    random: ['纯随机', '全部程序化随机生成的一场烟花秀'],
    original: ['原版复刻', '按截图实测坐标/颜色摆出那两发烟花（可与参考图逐帧对比）']
  };

  function $(id) { return document.getElementById(id); }

  function App() {
    var q = new URLSearchParams(location.search);
    this.canvas = $('stage');
    this.renderer = new FW.view.Renderer(this.canvas, 2);

    this.scene = SCENES[q.get('scene')] ? q.get('scene') : 'classic';
    this.seed = parseInt(q.get('seed'), 10);
    if (!(this.seed >= 0)) this.seed = FW.rng.defaultSeed();
    this.maxGeos = parseInt(q.get('max'), 10) || 130;
    // ?w=&h= 钉死逻辑坐标系（对应原版的 --width/--height）：构图与窗口大小无关，
    // 还原 Python 那一场 / 逐像素对拍时必须用。
    this.forceW = parseInt(q.get('w'), 10) || 0;
    this.forceH = parseInt(q.get('h'), 10) || 0;
    // ?frames=N 与 --render --frames N 同一条路径；?still=1 等价于 frames=1（参考图那一帧）
    if (q.has('frames')) this.freezeFrames = Math.max(1, parseInt(q.get('frames'), 10) || 1);
    else if (q.get('still') === '1' || q.get('still') === '') this.freezeFrames = 1;
    else this.freezeFrames = null;

    this.paused = false;
    this.hideUi = (q.get('ui') === '0');   // ?ui=0 开局就收起控制台（截图 / 嵌入用）
    // 光滑尾迹（canvas 增强）：?exact=1 关掉，退回原版的 2~6 段折线口径（兼容层，
    // 供行为基线与原版逐像素对拍使用；日常用法不必关心）
    this.denseTrails = (q.get('exact') !== '1');
    this.acc = 0.0;
    this.frames = 0;
    this.fps = 0;
    this.fpsT = performance.now();
    this.last = this.fpsT;
    this.show = null;

    this.build();
    this.bindPanel();
    this.bindKeys();
    this.syncPanel();
    if (this.hideUi) this.hideAllUi();
    this.last = performance.now();
    var self = this;
    requestAnimationFrame(function (t) { self.tick(t); });
  }

  /* ------------------------------------------------------------ 构建 / 重开 */

  App.prototype.build = function () {
    var cw = this.canvas.clientWidth || window.innerWidth;
    var ch = this.canvas.clientHeight || window.innerHeight;
    var lw, lh;
    if (this.forceW && this.forceH) { lw = this.forceW; lh = this.forceH; }
    else if (this.scene === 'original') { lw = ORIGINAL.W; lh = ORIGINAL.H; }
    else { lw = cw; lh = ch; }
    this.show = new FW.show.Show(lw, lh, new FW.rng.Random(this.seed),
                                 { maxGeos: this.maxGeos, denseTrails: this.denseTrails });
    FW.show.build(this.show, this.scene);
    this.acc = 0.0;
    if (this.freezeFrames !== null) {
      // 与 --render 完全同一条路径：先 step(0) 出初始几何，再走 N-1 个 1/60 步
      this.show.step(0.0);
      for (var i = 1; i < this.freezeFrames; i++) this.show.step(FIXED_DT);
      this.paused = true;
    }
    this.renderer.layout(this.show.w, this.show.h);
    document.title = '烟花 · seed ' + this.seed + ' · ' + this.scene;
    this.syncPanel();
  };

  /** 换场景 / 换种子 / 重放：整场重开。 */
  App.prototype.rebuild = function (scene, seed) {
    if (scene !== undefined && scene !== null) this.scene = scene;
    if (seed !== undefined && seed !== null) this.seed = seed;
    this.freezeFrames = null;                    // URL 的定格帧只在首次加载生效
    this.paused = false;
    this.build();
  };

  /* --------------------------------------------------------------- 主循环 */

  App.prototype.tick = function (now) {
    try {
      this.stepFrame(now);
    } catch (err) {
      // 与原版 TurtleApp.tick 一样不让一帧的异常把窗口卡死：原版打印 traceback 后
      // 停掉；这里把错误摆到 HUD 上 —— canvas 里 rAF 抛的异常默认是看不见的。
      this.crashed = true;
      console.error(err);
      $('panel').hidden = false;
      $('hud').hidden = false;
      $('show').hidden = true;
      var st = $('hud-state');
      st.textContent = '出错: ' + err.message;
      st.style.color = '#ff8a8a';
      return;                                  // 不再排下一帧
    }
    var self = this;
    requestAnimationFrame(function (t) { self.tick(t); });
  };

  /** 一帧：固定步长推进 + 重绘 + HUD（异常由 tick 兜住）。 */
  App.prototype.stepFrame = function (now) {
    var dt = (now - this.last) / 1000;
    this.last = now;
    if (!(dt > 0)) dt = 1e-4;
    dt = Math.min(DT_CLAMP, Math.max(1e-4, dt));

    if (!this.paused) {
      this.acc += dt;
      var steps = 0;
      while (this.acc >= FIXED_DT && steps < MAX_STEPS) {
        this.show.step(FIXED_DT);
        this.acc -= FIXED_DT;
        steps++;
      }
      if (steps >= MAX_STEPS) this.acc = 0.0;    // 落后太多就丢掉，不追
    }

    this.fit();
    this.renderer.draw(this.show.frameGeos);
    this.frames++;
    if (now - this.fpsT >= 500) {
      this.fps = this.frames * 1000 / (now - this.fpsT);
      this.frames = 0;
      this.fpsT = now;
      this.hud();
    }
  };

  /** 窗口尺寸变了：重算适配缩放；非 original 场景顺带把逻辑尺寸铺满窗口。 */
  App.prototype.fit = function () {
    var cw = this.canvas.clientWidth || window.innerWidth;
    var ch = this.canvas.clientHeight || window.innerHeight;
    if (cw === this.renderer.cw && ch === this.renderer.ch) return;
    var pinned = (this.forceW && this.forceH) || this.scene === 'original';
    if (!pinned) { this.show.w = cw; this.show.h = ch; }
    this.renderer.layout(this.show.w, this.show.h);
  };

  /* ------------------------------------------------------------------ HUD */

  App.prototype.hud = function () {
    $('hud-seed').textContent = this.seed;
    $('hud-scene').textContent = this.scene;
    $('hud-fps').textContent = this.fps.toFixed(0);
    $('hud-budget').textContent = this.show.lastGeos;
    $('hud-geos').textContent = this.renderer.geos;
    $('hud-segs').textContent = this.renderer.segs;
    $('hud-els').textContent = this.show.elements.length;
    $('hud-fw').textContent = this.show.fireworks.length;
    $('hud-wh').textContent = Math.round(this.show.w) + '×' + Math.round(this.show.h)
      + (Math.abs(this.renderer.scale - 1) > 1e-6 ? ' @' + this.renderer.scale.toFixed(2) : '');
    $('hud-time').textContent = this.show.time.toFixed(1) + 's';
    $('hud-state').textContent = this.paused
      ? (this.freezeFrames !== null || this.show.time === 0 ? '已定格' : '已暂停')
      : '运行中';
  };

  /** 把内部状态刷到控件上（换场景/换种子后调用）。 */
  App.prototype.syncPanel = function () {
    $('scene').value = this.scene;
    $('seed').value = this.seed;
    $('budget').value = this.maxGeos;
    $('dense').checked = this.denseTrails;
    $('budget-val').textContent = this.maxGeos;
    $('pause').textContent = this.paused ? '继续' : '暂停';
    $('scene-help').textContent = SCENES[this.scene][1];
    this.hud();
  };

  /* -------------------------------------------------------------- 交互 */

  App.prototype.togglePause = function () {
    if (this.paused && this.freezeFrames !== null) {
      // 从定格帧接着往下放（复刻图 → 会动的复刻版）
      this.freezeFrames = null;
    }
    this.paused = !this.paused;
    this.acc = 0.0;
    this.syncPanel();
  };

  App.prototype.bindPanel = function () {
    var self = this;
    $('scene').addEventListener('change', function () { self.rebuild(this.value, null); });
    $('seed').addEventListener('change', function () {
      var v = parseInt(this.value, 10);
      self.rebuild(null, (v >= 0) ? v : FW.rng.defaultSeed());
    });
    $('dice').addEventListener('click', function () {
      self.rebuild(null, FW.rng.defaultSeed());
    });
    $('pause').addEventListener('click', function () { self.togglePause(); });
    $('extra').addEventListener('click', function () { self.show.spawnRandom(1); });
    $('still').addEventListener('click', function () {
      self.rebuild('original', self.seed);
      self.show.step(0.0);                      // 第 1 帧 = 参考图
      self.paused = true;
      self.syncPanel();
    });
    $('replay').addEventListener('click', function () { self.rebuild(self.scene, self.seed); });
    $('save').addEventListener('click', function () { self.savePng(); });
    $('hide').addEventListener('click', function () { self.toggleUi(false); });
    $('show').addEventListener('click', function () { self.toggleUi(true); });
    $('dense').addEventListener('change', function () {
      // 只改画法，不动物理：运行中途开关都不会影响这一场演出
      self.show.denseTrails = this.checked;
      self.denseTrails = this.checked;
    });
    $('budget').addEventListener('input', function () {
      self.maxGeos = parseInt(this.value, 10);
      self.show.maxGeos = self.maxGeos;
      $('budget-val').textContent = self.maxGeos;
    });
  };

  App.prototype.bindKeys = function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      if (e.target && /input|select|textarea/i.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); self.togglePause(); }
      else if (e.key === 'r' || e.key === 'R') self.show.spawnRandom(1);
      else if (e.key === 'Escape') self.toggleUi($('panel').hidden);
    });
  };

  /** ?ui=0：面板 / HUD / ≡ 按钮全部藏掉（截图、嵌入用）。 */
  App.prototype.hideAllUi = function () {
    $('panel').hidden = true;
    $('hud').hidden = true;
    $('show').hidden = true;
  };

  App.prototype.toggleUi = function (showPanel) {
    $('panel').hidden = !showPanel;
    $('hud').hidden = !showPanel;
    $('show').hidden = showPanel;
  };

  App.prototype.savePng = function () {
    var a = document.createElement('a');
    a.download = 'fireworks_' + this.scene + '_seed' + this.seed
               + '_t' + this.show.time.toFixed(2) + '.png';
    a.href = this.renderer.toDataURL();
    a.click();
  };

  function boot() { FW.app = new App(); }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();

</script>
