<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #000020; color: #d7e5ff;

  }

  [hidden] { display: none !important; }

  /* ---------------------------------------------------------- 控制台 */
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 3;
    width: 238px; max-height: calc(100vh - 24px); overflow: auto;
    padding: 12px; border-radius: 14px;
    background: rgba(8, 12, 32, .74); backdrop-filter: blur(10px);
    border: 1px solid rgba(120, 160, 255, .16);
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
    display: flex; flex-direction: column; gap: 8px;
  }
  #panel h1 {
    margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; color: #f2f6ff;
  }

  /* 面板里的表单控件统一外观（滑块另有规则）。
     别用 input[type=text] 这种具体选择器 —— 换一次 type 就会漏掉样式。 */
  select, input:not([type=range]):not([type=checkbox]), button {
    font: inherit; font-size: 12px; color: #e8f0ff; padding: 6px 9px;
    background: rgba(255, 255, 255, .055); border: 1px solid rgba(140, 170, 255, .22);
    border-radius: 9px; outline: none;
  }
  button { cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  button:hover { background: rgba(140, 170, 255, .18); border-color: rgba(160, 190, 255, .45); }
  button:active { transform: translateY(1px); }
  button.mini { font-size: 11.5px; padding: 6px 2px; }
  /* 「每日」是个开关：亮着 = 这一场会跟着日期走（跨日自动换成新的一天） */
  button[aria-pressed="true"] {
    background: rgba(255, 211, 77, .14); border-color: rgba(255, 211, 77, .55);
    color: #ffd98a;
  }
  input:focus, select:focus { border-color: rgba(255, 211, 77, .6); }
  /* 键盘焦点要看得见（只用 :focus-visible，鼠标点击不画框） */
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #ffd34d; outline-offset: 1px; border-color: rgba(255, 211, 77, .6);
  }
  /* 读屏用：视觉上藏起来，但仍然会被朗读 */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    border: 0;
  }
  #motion-note { margin: 0; font-size: 10.5px; line-height: 1.5; color: #ffd98a; }

  /* 种子：文本 + 两个小按钮，一行放下（标签不换行、输入框可压缩） */
  .seedrow { display: flex; align-items: center; gap: 6px; }
  .seedrow .lab { flex: 0 0 auto; font-size: 11.5px; color: rgba(178, 198, 255, .6);
                  white-space: nowrap; }
  #seed {
    flex: 1 1 auto; min-width: 0; padding: 6px 4px; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    transition: border-color .15s;
  }
  /* 敲错字母时抖一下：这就是"试探"的反馈 */
  @keyframes seed-reject { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); }
                           70% { transform: translateX(4px); } }
  #seed.reject { animation: seed-reject .22s; border-color: rgba(255, 138, 138, .85); }

  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .row.primary button { padding: 8px 9px; font-size: 12.5px; }
  /* 次要动作挤成一格一格，别和主操作一样重 */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  .budgetrow input[type=range] { flex: 1; accent-color: #ffd34d; min-width: 0; }

    margin: 0; padding-top: 8px; border-top: 1px solid rgba(120, 160, 255, .12);
    font-size: 10.5px; line-height: 1.65; color: rgba(170, 195, 255, .45);
    overflow-wrap: anywhere;
  }

  #show { position: fixed; top: 12px; left: 12px; z-index: 3; }

  /* 录制指示条：DOM 浮层，不会被 captureStream 录进画面 */
  #rec {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 4;
    display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 999px;
    background: rgba(8, 12, 32, .82); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 138, 138, .45); color: rgba(255, 215, 215, .85); font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  #rec b { color: #ff8a8a; font-weight: 600; }

  /* --------------------------------------------------------------- HUD */
  /* 压成两行：上面演出、下面性能。字段由标记决定，缺了就自动跳过 */
  #hud {
    position: fixed; top: 12px; right: 12px; z-index: 2;
    padding: 7px 11px; border-radius: 11px;
    display: flex; flex-direction: column; gap: 1px;
    background: rgba(8, 12, 32, .55); backdrop-filter: blur(8px);
    border: 1px solid rgba(120, 160, 255, .12);
    font: 11.5px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; color: #dbe6ff;
  }
  #hud .line { display: flex; align-items: baseline; gap: 5px; }
  #hud .k { color: rgba(170, 195, 255, .42); }
  #hud b { font-weight: 600; color: #ffd98a; margin-right: 5px; }
  #hud #hud-state { margin-left: auto; color: #9ad7ff; }

  /* 窄屏：面板在左、HUD 在右，挤到一起就先把性能那一行收掉 */
  @media (max-width: 780px) {
    #hud { max-width: calc(100vw - 276px); flex-wrap: wrap; }
    #hud .line:nth-child(2) { display: none; }
  }
  @media (max-width: 520px) {
    #hud { display: none; }             /* 手机：画面优先 */
  }

  /* 系统开了"减少动效"：连 CSS 的过渡/抖动动画也一起关掉（JS 那边见 src/a11y.js） */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

<canvas id="stage" role="img" aria-label="程序化烟花秀的画面（纯装饰，操作都在左侧控制台）"></canvas>

<aside id="panel" aria-label="控制台">
  <h1>烟花 · Fireworks</h1>

  <div class="seedrow">
    <label class="lab" for="seed">种子</label>
    <input id="seed" type="text" maxlength="16" autocomplete="off" spellcheck="false">
    <button id="dice-number" class="mini" title="随机换一个数字种子">随机</button>
    <button id="daily" class="mini" aria-pressed="false"
            title="回到今天这一场，并跟着日期自动更新">每日</button>
  </div>
  <p class="help">配色、花型、位置全随机</p>

  <div class="row primary">
    <button id="pause" aria-pressed="false" aria-keyshortcuts="Space">暂停</button>
    <button id="extra" aria-keyshortcuts="R" title="快捷键 R；点画面则在那个位置炸">放一发</button>
  </div>

  <div class="grid">
    <button id="replay" class="mini" title="同一个种子从头再放一遍">重放</button>
    <button id="share" class="mini" title="复制这一场的链接">链接</button>
    <button id="save" class="mini" title="把当前画面存成 PNG">存图</button>
    <button id="record" class="mini" title="录成 WebM（只录画布，元数据里写种子）">录制</button>
    <button id="fullscreen" class="mini" title="全屏（Esc 退出）">全屏</button>
    <button id="hide" class="mini" title="收起面板（Esc）">收起</button>
    <button id="sound" class="mini" aria-pressed="false"
            title="音效开关（现场合成，没有音频文件）">声音</button>
    <button id="tune-open" class="mini" title="打开 / 收起调参面板（快捷键 T）">调参</button>
  </div>

  <p id="motion-note" hidden></p>

  <div class="budgetrow">
    <label for="budget">绘制预算</label>
    <input id="budget" type="range" min="80" max="1500" step="20">
    <b id="budget-val">450</b>
  </div>

  <p class="hint">空格 暂停 · R 放一发 · Esc 收起 · 点画面 = 在那里炸一发</p>
</aside>

<p id="a11y-status" class="sr-only" role="status" aria-live="polite"></p>

<button id="show" hidden>控制台</button>

<div id="rec" hidden aria-hidden="true"><b>录制中</b><span id="rec-time">0.0s</span><button id="rec-stop">停止</button></div>

<div id="hud" aria-hidden="true">
  <div class="line">
    <span class="k">seed</span><b id="hud-seed">–</b>
    <span class="k">时刻</span><b id="hud-time">–</b>
    <b id="hud-state">–</b>
  </div>
  <div class="line">
    <span class="k">fps</span><b id="hud-fps">–</b>
    <span class="k">预算</span><b id="hud-budget">–</b>
    <span class="k">图元</span><b id="hud-geos">–</b>
    <span class="k">线段</span><b id="hud-segs">–</b>
    <span class="k">在飞</span><b id="hud-fw">–</b>
    <span class="k">画布</span><b id="hud-wh">–</b>
  </div>
</div>

<script>
/* 兜底自检：如果 1.5 秒后 App 还没被创建出来，就**把原因写在页面上**。
   一个模块都没加载完 / 入口模块没加载 / 直接双击了未构建的 index.html，
   这几种情况的共同表现是"空白画面 + 控制台零输出"，没有提示根本无从下手。 */
setTimeout(function () {
  var fw = window.FW || {};
  if (fw.app && fw.app.instance) return;                 // 一切正常
  var have = Object.keys(fw);
  var why = !fw.app
    ? '模块没加载完（连 app.js 都没到）。若你是直接双击 index.html：请用 <b>npm start</b>，'
      + '或打开构建好的 <b>dist/fireworks.html</b>。'
    : '入口模块 ui.js 没执行。检查它是不是 404（src/manifest.json 里列了但文件不在 / 名字写错）'
      + '或加载时报错 —— 这两种情况都会让页面什么都不构造。';
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'
    + 'max-width:min(540px,86vw);padding:18px 20px;border-radius:14px;z-index:9;'
    + 'background:rgba(6,10,30,.94);border:1px solid rgba(255,138,138,.55);'
    + 'color:#ffd7d7;font:13px/1.75 system-ui,-apple-system,"PingFang SC",sans-serif';
  box.innerHTML = '<b style="font-size:15px">烟花没起来</b><br>'
    + '1.5 秒内没有创建出 App 实例。<br>' + why
    + '<br><br><span style="color:rgba(255,215,215,.65)">已加载的模块：'
    + (have.length ? have.join(', ') : '（一个都没有）')
    + '<br>具体报错请看浏览器控制台。</span>';
  document.body.appendChild(box);
}, 1500);
</script>

<script>
/* ===================== src/core.js ===================== */
/* ============================================================================
 * core.js —— 数学 / 颜色基础件
 * 对应 turtle_fireworks.py 的「颜色小工具」一节。
 * 纯计算，不碰 DOM：Node 侧的复刻校验脚本也会加载它。
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var TAU = Math.PI * 2;
  var RAD2DEG = 180 / Math.PI;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /** HSV(0..1) -> RGB(0..1)；与 Python colorsys.hsv_to_rgb 同口径。 */
  function hsv(h, s, v) {
    h = ((h % 1) + 1) % 1;
    s = clamp(s, 0, 1);
    v = clamp(v, 0, 1);
    var i = Math.floor(h * 6);
    var f = h * 6 - i;
    var p = v * (1 - s);
    var q = v * (1 - f * s);
    var t = v * (1 - (1 - f) * s);
    switch (i % 6) {
      case 0: return [v, t, p];
      case 1: return [q, v, p];
      case 2: return [p, v, t];
      case 3: return [p, q, v];
      case 4: return [t, p, v];
      default: return [v, p, q];
    }
  }

  /** 夜空背景，取自参考图 #000020。 */
  var BG = hsv(2 / 3, 1.0, 0.125);

  /**
   * 变暗 = 朝背景色淡出（k=1 原色，k=0 与背景一模一样）。
   * 比单纯乘系数干净：将熄的火花不会在深蓝夜空上留一圈灰黑残影。
   */
  function fade(c, k) {
    if (k <= 0) return BG;
    if (k >= 1) return c;
    return [BG[0] + (c[0] - BG[0]) * k,
            BG[1] + (c[1] - BG[1]) * k,
            BG[2] + (c[2] - BG[2]) * k];
  }

  /** 两色线性插值。 */
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t,
            a[1] + (b[1] - a[1]) * t,
            a[2] + (b[2] - a[2]) * t];
  }

  /** Python 的 round()：四舍六入五取偶（banker's rounding）。 */
  function pyRound(x) {
    var f = Math.floor(x);
    var d = x - f;
    if (d > 0.5) return f + 1;
    if (d < 0.5) return f;
    return f % 2 === 0 ? f : f + 1;
  }

  /** RGB(0..1) -> '#rrggbb'；顺手夹掉越界 / NaN。 */
  function toHex(c) {
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = c[i];
      if (!(v === v) || v < 0) v = 0; else if (v > 1) v = 1;
      out += (pyRound(v * 255) + 0x100).toString(16).slice(1);
    }
    return out;
  }

  /** 把一长串轨迹点均匀抽稀到最多 segMax 段，控制每帧要画多少图元。 */
  function decimate(pts, segMax) {
    var n = pts.length;
    if (n <= segMax + 1) return pts;
    var out = new Array(segMax + 1);
    for (var i = 0; i <= segMax; i++) out[i] = pts[pyRound(i * (n - 1) / segMax)];
    return out;
  }

  FW.core = {
    TAU: TAU, RAD2DEG: RAD2DEG, clamp: clamp, hsv: hsv, BG: BG,
    fade: fade, mix: mix, pyRound: pyRound, toHex: toHex, decimate: decimate
  };
})(globalThis.FW || (globalThis.FW = {}));

/* ===================== src/rng.js ===================== */
/* ============================================================================
 * rng.js —— MT19937，逐位对齐 CPython 的 random.Random
 * ---------------------------------------------------------------------------
 * 原版用 random.Random(seed) 决定整场演出的位置/颜色/寿命。这里把 Mersenne
 * Twister 和 CPython 的播种（init_by_array）一起搬过来，所以**同一个 seed 在
 * Python 与浏览器里放出的是同一场烟花**（tools/verify.js 会逐位校验）。
 *   random()  -> genrand_res53（两个 32bit 拼 53bit）
 *   randint / randrange / choice -> _randbelow_with_getrandbits
 * ==========================================================================*/
;(function (FW) {
  'use strict';

  var N = 624, M = 397;
  var MATRIX_A = 0x9908b0df, UPPER = 0x80000000, LOWER = 0x7fffffff;

  /** 整数种子（含任意长的数字串）-> init_by_array 的 key，与 CPython 完全一致。 */
  function seedToKey(value) {
    var v;
    if (typeof value === 'bigint') v = value;
    else {
      var text = String(value).trim();
      v = /^[+-]?\d+$/.test(text) ? BigInt(text)          // 大整数也精确，不经过 Number
                                  : BigInt(Math.trunc(Number(value)));
    }
    if (v < 0n) v = -v;                            // CPython 也取绝对值
    var key = [];
    if (v === 0n) key.push(0);                     // seed 0 -> key = [0]
    while (v > 0n) { key.push(Number(v & 0xffffffffn)); v >>= 32n; }
    return key;
  }

  /** 种子是不是"纯数字"（决定它与 CPython 逐位一致、以及用哪个场景）。 */
  function isNumericSeed(value) { return /^[+-]?\d+$/.test(String(value).trim()); }

  /**

    $('pause').textContent = this.paused ? '继续' : '暂停';
    $('pause').setAttribute('aria-pressed', this.paused ? 'true' : 'false');
    // 「每日」是个开关：亮着 = 这一场会跟着日期自动换（每天零点后自己变成新的一天）
    var d = $('daily');
    if (d) {
      d.setAttribute('aria-pressed', this.dailyMode ? 'true' : 'false');
      d.title = this.dailyMode
        ? '今日这一场（已开启：跨日会自己换成新的一天）'
        : '回到今天这一场，并跟着日期自动更新';
    }
    // 「声音」也是开关：亮着 = 有音效（首次点击/按键之后才真的出声，见 sound.js）
    var s = $('sound');
    if (s && this.sound) {
      s.setAttribute('aria-pressed', this.sound.enabled ? 'true' : 'false');
      s.title = this.sound.enabled
        ? (FW.sound.supported() ? '音效已开（现场合成，没有音频文件）' : '这个浏览器不支持 Web Audio')
        : '音效已关';
    }
    document.title = '烟花 · Fireworks · seed ' + this.seed;
    this.motionNote();
    this.applyUiVisibility();
    this.hud();
  };

  /** "每日"模式下跨日自动换场了：在控制台说一声，别打断画面。 */
  FW.app.App.prototype.onDayRoll = function (seed) {
    console.log('%c跨日 —— 换成今天的这一场', 'color:#7fd1ff;font-weight:600', 'seed ' + seed);
  };

  FW.app.App.prototype.applyUiVisibility = function () {
    var hidden = this.hideUi || this.uiHidden;
    $('panel').hidden = hidden;
    $('hud').hidden = hidden;
    // ?ui=0 是"彻底无 UI"（截图 / 嵌入），连恢复按钮都不留；
    // 手动「收起」才留一个「控制台」按钮把面板叫回来。
    $('show').hidden = this.hideUi || !hidden;
  };

  FW.app.App.prototype.toggleUi = function () {
    this.uiHidden = !this.uiHidden;
    this.applyUiVisibility();
  };

  /** 出错了：把信息摆到 HUD 上（canvas 里 rAF 抛的异常默认是看不见的）。 */
  FW.app.App.prototype.onError = function (err) {
    console.error(err);
    this.hideUi = false;
    this.uiHidden = false;
    this.applyUiVisibility();
    var st = $('hud-state');
    st.textContent = '出错: ' + err.message;
    st.style.color = '#ff8a8a';
  };

  /* --------------------------------------------------------------- 交互 */

  /**
   * 种子框的"逐字符"守卫：正常只收数字；字母只有当它正好接上那个词时才留得下来，
   * 敲错了就当场退回上一个合法内容并抖一下 —— 所以"一个一个字母试"是有反馈的。
   * 粘贴也走同一条校验。
   */
  FW.app.App.prototype.bindSeedInput = function () {
    var self = this;
    var input = $('seed');
    var lastValid = this.seed;
    input.value = lastValid;

    input.addEventListener('input', function () {
      var text = this.value.toUpperCase();
      if (!FW.app.seedContentOk(text)) {          // 既不是数字，也不是那个词的前缀
        this.value = lastValid;
        this.classList.remove('reject');
        void this.offsetWidth;                    // 强制重排，动画才会重播
        this.classList.add('reject');
        clearTimeout(self.rejectTimer);
        self.rejectTimer = setTimeout(function () { input.classList.remove('reject'); }, 240);
        return;
      }
      lastValid = text;
      this.value = text;
      if (text === FW.app.SECRET) {               // 拼全了：当场插播一次
        self.interlude();
        lastValid = this.value;                   // 框里已被刷回数字种子
        console.log('%c插播：参考图风格的两发', 'color:#ffd34d;font-weight:700');
        self.say('插播：参考图风格的两发');
      }
    });

    // 聚焦就全选：想换种子直接敲，不用先手动删掉旧的
    input.addEventListener('focus', function () { this.select(); });

    // 回车 = 敲完了：收起焦点，快捷键随即恢复（否则 R 还会被当成在打字）
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') this.blur();
    });

    // 数字种子在失焦 / 回车时生效（免得每敲一位就重开一场）
    input.addEventListener('change', function () {
      if (/^\d+$/.test(this.value)) {
        self.rebuild(this.value, false);                 // 敲数字 = 钉住这一场
        self.say('换到 seed ' + self.seed);
      } else if (this.value === '') self.reseed();
    });
  };

  FW.app.App.prototype.bindPanel = function () {
    var self = this;
    this.bindSeedInput();
    $('dice-number').addEventListener('click', function () {
      self.reseed();
      self.say('随机换一场，seed ' + self.seed);
    });
    $('pause').addEventListener('click', function () { self.pauseAndSay(); });
    $('extra').addEventListener('click', function () { self.gesture(); self.extra(); });
    $('replay').addEventListener('click', function () {
      self.rebuild(self.seed);
      self.say('从头再放一遍');
    });
    $('save').addEventListener('click', function () { self.savePng(); });
    $('hide').addEventListener('click', function () { self.toggleUi(); });
    $('record').addEventListener('click', function () { self.toggleRecord(); });
    $('rec-stop').addEventListener('click', function () { self.stopRecord(); });
    this.bindSound();
    // 点/触摸画面：在那里炸一发；顺便把焦点从种子框收回（R 之类立刻恢复）
    this.canvas.addEventListener('pointerdown', function (e) {
      self.gesture();
      var el = document.activeElement;
      if (el && el.id === 'seed') el.blur();
      self.launchAt(e.clientX, e.clientY);
    });
    $('daily').addEventListener('click', function () {
      self.daily();
      self.say('换到今天的这一场，seed ' + self.seed + '（会跟着日期自动更新）');
    });
    $('share').addEventListener('click', function () { self.copyLink(this); });
    $('fullscreen').addEventListener('click', function () { self.toggleFullscreen(this); });
    $('tune-open').addEventListener('click', function () { FW.tuneUi.toggle(self.store); });
    $('show').addEventListener('click', function () { self.toggleUi(); });
    $('budget').addEventListener('input', function () {
      self.maxGeos = parseInt(this.value, 10);
      self.show.maxGeos = self.maxGeos;
      $('budget-val').textContent = self.maxGeos;
    });
  };

  FW.app.App.prototype.bindKeys = function () {
    var self = this;
    window.addEventListener('keydown', function (e) {
      // Esc 永远有效（它不会往输入框里塞字符）；录制中先停录制
      if (e.key === 'Escape') {
        if (self.recorder && self.recorder.recording()) self.stopRecord();
        else self.toggleUi();
        return;
      }
      // 只有"真的在往里打字"的控件才让出快捷键。原来是 input/select/textarea 一概
      // 让位 —— 而「绘制预算」滑块本身就是 <input>，拖完滑块再按 R 会毫无反应。
      var el = e.target || {};
      var tag = String(el.tagName || '').toLowerCase();
      var typing = (tag === 'textarea') || (tag === 'select')
        || (tag === 'input'
            && /^(text|number|search|email|url|password|tel)$/.test(el.type || 'text'));
      if (typing) return;
      if (e.code === 'Space') { e.preventDefault(); self.pauseAndSay(); }
      else if (e.key === 'r' || e.key === 'R') { self.gesture(); self.extra(); }
    });
  };

  /* --------------------------------------------------------------- 启动 */

  /**
   * 控制台里那张便条：只交代"种子框认数字"，顺口提一句那个词有几个字母，
   * 不点破是哪个词，也不说敲对了会换来什么（剩下的靠往种子框里一个一个
   * 字母试，敲错了会被弹回来）。
   */
  function consoleNote(app) {
    var gold = 'color:#ffd34d;font-weight:600';
    var cyan = 'color:#7fd1ff;font-weight:600';
    console.log('%c烟花 · Fireworks', gold);
    console.log('seed %c' + app.seed + (app.dailyMode ? '（每日：跟着日期走）' : ''), cyan);
    if (app.eggFound) return;
    console.log('种子框只收数字。有一个 %c' + FW.app.SECRET.length
      + ' 个字母%c的词是例外 —— 一个一个敲试试。',
      'color:#ffd34d', 'color:inherit');
  }

  /** localStorage 里记几个键：上次的种子 / "每日"开关 / "声音"开关 / 调参结果（隐私模式下会抛错，都包起来）。 */
  function store() {
    return {
      get: function (k) { try { return localStorage.getItem('fw.' + k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem('fw.' + k, v); } catch (e) { /* 无所谓 */ } },
      remove: function (k) { try { localStorage.removeItem('fw.' + k); } catch (e) { /* 无所谓 */ } }
    };
  }

  /** 音效引擎：只在浏览器支持时建；开关状态来自上次的选择（默认开）。 */
  function soundEngine(st) {
    if (!FW.sound || !FW.sound.supported()) return null;
    return new FW.sound.Engine({ enabled: st.get('sound') !== '0' });
  }

  function boot() {
    var st = store();
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    // 调参：存储里那份改动**照常生效**（那是你自己这台机器上的选择）；`?tune=1` 只是
    // "一进来就把面板打开"，面板平时按控制台的「调参」或 T 也能开。必须在这里读 ——
    // 背景色 / 电平 / 低通 / 减少动效降幅都是"建的时候取一次"。没调过的人没有 fw.tune，
    // 打开的永远是默认档。
    FW.tune.load(st);
    FW.tuneUi.bindKeys(st);
    var inst = new FW.app.App({
      canvas: $('stage'),
      search: new URLSearchParams(location.search),
      store: st,
      sound: soundEngine(st),                  // 音效引擎要在 bindPanel 之前就位
      reducedMotion: !!(mq && mq.matches)
    });
    FW.app.instance = inst;
    if (FW.tune.wanted()) FW.tuneUi.mount(st);
    if (mq) inst.bindReducedMotion(mq);
    inst.start();
    inst.syncPanel();                    // 声音开关的 aria 状态要一开始就对
    consoleNote(inst);
    // 只在用户动作之后才播报（读屏用户一进来不该听一串状态）
    if (inst.reduceMotion) {
      console.log('系统设置：减少动效 —— 不自动放，只有手动才动');
      inst.say('已按系统设置减少动效：只有你按 R 或点画面才放');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(globalThis.FW || (globalThis.FW = {}));
</script>
</body>
</html>
